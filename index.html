<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oráculo Business Hub | GYN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="nav-container" id="folderNav"></nav>
    <main id="mainContent" class="container"></main>

    <script>
        // Objeto Central de Configuração (JSON de Nichos)
        const oraculoNiches = {
            "Principal": { cor: "#FFD700", items: ["Site Profissional", "Sistema SaaS", "Marketing Digital"] },
            "Restaurante": { cor: "#007bff", items: ["Prato do Dia", "Marmitex", "Refrigerante", "Sucos"] },
            "Pastelaria": { cor: "#dc3545", items: ["Pastel de Carne", "Queijo", "Especial", "Caldo de Cana"] },
            "Jantinha": { cor: "#ffc107", items: ["Espetinho", "Tropeiro", "Refrigerante", "Combo"] },
            "Pit Dog": { cor: "#ff5722", items: ["X-Tudo", "Sanduíche", "Bebidas", "Adicionais"] },
            "Ar-Condicionado": { cor: "#17a2b8", items: ["Limpeza Técnica", "Instalação", "Manutenção"] },
            "Piscina": { cor: "#28a745", items: ["Limpeza Geral", "Tratamento Químico", "Aspiração"] },
            "Jardinagem": { cor: "#5d4037", items: ["Corte de Grama", "Poda", "Paisagismo"] },
            "Pedreiro": { cor: "#6c757d", items: ["Reforma", "Assentamento", "Pintura"] },
            "Estética Auto": { cor: "#343a40", items: ["Lavagem Técnica", "Proteção", "Higienização"] },
            "Borracharia": { cor: "#212529", items: ["Troca de Pneu", "Reparo", "Balanceamento"] },
            "Barbearia": { cor: "#000000", items: ["Corte", "Barba", "Design"] },
            "Nail Design": { cor: "#e83e8c", items: ["Alongamento", "Manicure", "Pedicure"] },
            "Marketing": { cor: "#6f42c1", items: ["Gestão Redes", "Tráfego Pago", "Design"] }
        };

        function render(nicho) {
            const data = oraculoNiches[nicho];
            document.body.style.setProperty('--primary-color', data.cor);
            
            const main = document.getElementById('mainContent');
            main.innerHTML = `<h1>${nicho.toUpperCase()}</h1>` + 
                data.items.map(item => `
                    <div class="card">
                        <h3>${item}</h3>
                        <a href="mailto:contato.oraculo.system@gmail.com?subject=Orçamento: ${nicho} - ${item}" class="btn-order">Solicitar Orçamento</a>
                    </div>`).join('');
        }

        const nav = document.getElementById('folderNav');
        Object.keys(oraculoNiches).forEach(nicho => {
            nav.innerHTML += `<div class="folder-tab" onclick="render('${nicho}')">${nicho}</div>`;
        });
        
        render("Principal"); // Inicializa na aba Principal
    </script>
</body>
</html>
